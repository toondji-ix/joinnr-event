packages:
  - apps/*
  - packages/*

# Do not execute downloaded package lifecycle scripts during setup.
ignoreScripts: true
saveExact: true
engineStrict: true
strictPeerDependencies: true
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - '@expo/cli@58.1.10'
  - babel-preset-expo@58.0.17
  - expo-modules-core@58.0.21
  - expo@58.0.13
