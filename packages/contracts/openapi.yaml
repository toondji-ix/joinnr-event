        inaccessible IDs, and lock the canonical pair/request with a lock order compatible with
        block. Recheck account, membership, block, event/networking and request expiry using trusted
        transaction time; scheduler delay cannot extend permission. Require pending state: 409 for a
        terminal or expired request, 412 for a stale version after access checks. Increment request
        version and commit the transition with minimal outbox facts; never modify a terminal request
        or restore contact access. Real transaction, authorization and concurrency enforcement are
        future work."
      x-authorization:
        actor: request-sender
        scope: event-request-pair
        invariants:
          - active-same-event-memberships
          - live-participant-role
          - pending-request-only
          - open-networking-window
