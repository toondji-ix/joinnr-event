openapi: 3.1.0
info:
  title: Joinnr foundation API contracts
  version: 0.4.0
  description: 'Phase-four contract foundation: organization/event creation, access resolution and
    connection request lifecycle and self profile interests/goals. Specifications only; no routes, authentication or database
    enforcement implemented. Examples are synthetic; provider and policy gates remain open.'
servers:
  - url: /v1
    description: Same-origin API prefix; no deployment hostname is presumed.
security:
  - accessToken: []
tags:
  - name: Organizations
    description: Tenant ownership established by a verified, MFA-authenticated user.
  - name: Events
    description: Conference-only event lifecycle, scoped to the owning organization.
  - name: Access
    description: Safe event preview; access resolution does not admit an attendee.
  - name: Requests
    description: Event-scoped explicit connection requests; acceptance never discloses contacts.
  - name: Profiles
    description: Self-only event profile updates; taxonomy selections do not grant networking access.
paths:
  /events/{eid}/profiles/{mid}:
    get:
      operationId: getRelatedPublicProfile
      summary: Read a related same-event attendee public profile
      description: >-
        Resolve the authenticated actor and both memberships from live server records.
        Require active accounts, active same-event memberships, current networking eligibility,
        event availability and no block in either direction. Require a currently authorized
        recommendation, request or connection relation to the target. Recheck relation validity
        and expiry at read time; possession of an ID or stale recommendation never grants access.
        Unknown and inaccessible targets receive the same 404. Return only PublicProfile;
        contacts, private goal detail and assessment data are forbidden even after acceptance.
        No global directory or arbitrary profile lookup is introduced. Contract only; no route implemented.
      tags: [Profiles]
      x-authorization:
        actor: eligible-event-attendee
        scope: event-related-profile
        invariants:
          - active-same-event-memberships
          - live-recommendation-request-or-connection
          - no-block-in-either-direction
          - no-private-profile-fields
      parameters:
        - $ref: '#/components/parameters/EventId'
        - name: mid
          in: path
          required: true
          description: Target membership in this event; never an authorization credential.
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Allowlisted public profile after live authorization.
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicProfileEnvelope' }
              examples:
                synthetic:
                  value:
                    data:
                      membership_id: 01900000-0000-7000-8000-000000000003
                      event_id: 01900000-0000-7000-8000-000000000004
                      display_name: Synthetic attendee
                      headline: Platform engineer
                      interests: [Developer platforms, Mentoring, Infrastructure]
                      goals: [Offer platform mentorship]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /organizations:
    post:
      operationId: createOrganization
      summary: Create an organization and its owner membership atomically
      description:
        Requires a verified account and MFA. The actor comes from validated authentication,
        never from the request body. Ownership is assigned by the service, not by a supplied role.
        Idempotent replay returns the same logical result. This contract does not implement identity
        or persistence.
      tags:
        - Organizations
      x-authorization:
        actor: verified-user-with-mfa
        scope: self
        invariants:
          - server-assigned-owner
          - atomic-owner-membership
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
            examples:
              synthetic:
                summary: Synthetic organization name
                value:
                  name: Synthetic Conference Team
      responses:
        '201':
          description: Organization and owner membership committed in one transaction.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationEnvelope'
              examples:
                synthetic:
                  value:
                    data:
                      id: 01900000-0000-7000-8000-000000000001
                      name: Synthetic Conference Team
                      version: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /organizations/{oid}/events:
    post:
      operationId: createEvent
      summary: Create a conference draft in an owned organization
      description:
        Organization ownership is checked against current server-side membership. Other staff
        cannot create events in the MVP. An inaccessible organization returns the same 404 as an
        unknown ID. Draft creation must not generate access credentials, publish an event, or enroll
        its creator as an attendee. The initial capacity envelope is a proposed engineering
        baseline, not a validated business commitment.
      tags:
        - Events
      x-authorization:
        actor: organization-owner
        scope: organization-path
        invariants:
          - current-membership
          - staff-mfa
          - conceal-inaccessible-object
          - conference-only
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
            examples:
              synthetic:
                summary: Synthetic conference and dates; not a pilot commitment
                value:
                  title: Synthetic Technology Conference
                  description: Contract validation example only.
                  category: technology_conference
                  timezone: Africa/Lagos
                  starts_at: 2027-01-20T08:00:00Z
                  ends_at: 2027-01-20T17:00:00Z
                  admission_opens_at: 2027-01-13T08:00:00Z
                  admission_closes_at: 2027-01-20T12:00:00Z
                  networking_opens_at: 2027-01-13T08:00:00Z
                  networking_closes_at: 2027-01-27T17:00:00Z
                  capacity: 500
                  admission_mode: approval
      responses:
        '201':
          description: Draft created with an organizer assignment for the creator.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftEventEnvelope'
              examples:
                synthetic:
                  value:
                    data:
                      id: 01900000-0000-7000-8000-000000000002
                      organization_id: 01900000-0000-7000-8000-000000000001
                      status: draft
                      version: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /access/resolve:
    post:
      operationId: resolveEventAccess
      summary: Resolve one event credential to a safe preview and short-lived intent
      description:
        Public and rate-limited. Accept exactly one credential. An invalid, expired, rotated,
        closed or cancelled credential receives the same generic 400. Response must not contain
        members, contacts, profile data or the supplied credential. Signed intent lifetime is at
        most 10 minutes and never exceeds credential expiry. Later enrollment revalidates credential
        version and event policy; this operation does not reserve capacity or grant admission.
      tags:
        - Access
      security: []
      x-authorization:
        actor: public
        scope: credential
        invariants:
          - generic-invalid-credential
          - safe-preview-only
          - no-admission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessResolutionInput'
            examples:
              syntheticCode:
                summary: Synthetic eight-character code
                value:
                  join_code: AB23CD45
              syntheticLink:
                summary: Synthetic opaque credential, never a real invitation
                value:
                  link_token: synthetic_contract_token_00000001
      responses:
        '200':
          description: Published-event preview and a credential-bound join intent.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessResolutionEnvelope'
              examples:
                synthetic:
                  value:
                    data:
                      event:
                        id: 01900000-0000-7000-8000-000000000002
                        organization_name: Synthetic Conference Team
                        title: Synthetic Technology Conference
                        category: technology_conference
                        timezone: Africa/Lagos
                        starts_at: 2027-01-20T08:00:00Z
                        ends_at: 2027-01-20T17:00:00Z
                        admission_opens_at: 2027-01-13T08:00:00Z
                        admission_closes_at: 2027-01-20T12:00:00Z
                        networking_opens_at: 2027-01-13T08:00:00Z
                        networking_closes_at: 2027-01-27T17:00:00Z
                        admission_mode: approval
                        status: published
                      join_intent: synthetic_signed_intent_not_a_real_token
                      expires_at: 2027-01-13T08:10:00Z
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /events/{eid}/requests:
    post:
      operationId: createConnectionRequest
      summary: Send an explicit event-scoped connection request
      tags:
        - Requests
      description: 'Eligible self only. Verify both current accounts, active same-event memberships,
        networking consent, live relationship, blocks, quotas and open networking window. A
        recommendation must belong to the sender/event/pair. Omission of recommendation_id never
        authorizes guessed IDs: an existing received-request relation is required instead.
        Canonicalize and lock the pair. An existing same-direction or crossed pending request
        returns 200 without auto-accepting or changing sender/receiver. New requests commit once
        with minimal outbox facts. No contacts are returned. All live checks remain unimplemented.'
      x-authorization:
        actor: eligible-attendee
        scope: event-and-pair
        invariants:
          - active-same-event-memberships
          - live-networking-consent
          - live-authorized-relation
          - no-self-or-blocked-pair
          - open-networking-window
          - canonical-pair-lock
          - crossed-request-never-auto-accepts
          - transactional-outbox
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestInput'
            examples:
              synthetic:
                value:
                  target_mid: 01900000-0000-7000-8000-000000000004
                  recommendation_id: 01900000-0000-7000-8000-000000000007
                  intro: Synthetic introduction only.
      responses:
        '200':
          description: Existing same-direction or crossed pending request; receiver must explicitly decide.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingRequestEnvelope'
              examples:
                synthetic:
                  value:
                    data:
                      id: 01900000-0000-7000-8000-000000000005
                      event_id: 01900000-0000-7000-8000-000000000002
                      sender:
                        membership_id: 01900000-0000-7000-8000-000000000003
                        event_id: 01900000-0000-7000-8000-000000000002
                        display_name: Synthetic attendee
                        headline: Contract fixture
                        interests:
                          - Platforms
                          - Accessibility
                          - Testing
                        goals:
                          - Offer platform mentorship
                      receiver:
                        membership_id: 01900000-0000-7000-8000-000000000004
                        event_id: 01900000-0000-7000-8000-000000000002
                        display_name: Synthetic attendee
                        headline: Contract fixture
                        interests:
                          - Platforms
                          - Accessibility
                          - Testing
                        goals:
                          - Offer platform mentorship
                      status: pending
                      created_at: 2027-01-20T09:00:00Z
                      expires_at: 2027-01-27T17:00:00Z
                      version: 1
        '201':
          description: New pending request; no contact sharing.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingRequestEnvelope'
              examples:
                synthetic:
                  value:
                    data:
                      id: 01900000-0000-7000-8000-000000000005
                      event_id: 01900000-0000-7000-8000-000000000002
                      sender:
                        membership_id: 01900000-0000-7000-8000-000000000003
                        event_id: 01900000-0000-7000-8000-000000000002
                        display_name: Synthetic attendee
                        headline: Contract fixture
                        interests:
                          - Platforms
                          - Accessibility
                          - Testing
                        goals:
                          - Offer platform mentorship
                      receiver:
                        membership_id: 01900000-0000-7000-8000-000000000004
                        event_id: 01900000-0000-7000-8000-000000000002
                        display_name: Synthetic attendee
                        headline: Contract fixture
                        interests:
                          - Platforms
                          - Accessibility
                          - Testing
                        goals:
                          - Offer platform mentorship
                      status: pending
                      created_at: 2027-01-20T09:00:00Z
                      expires_at: 2027-01-27T17:00:00Z
                      version: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /events/{eid}/requests/{rid}/accept:
    post:
      operationId: acceptConnectionRequest
      summary: Accept a pending connection request
      tags:
        - Requests
      description:
        "Only the request-receiver may act. Require the request's strong If-Match version; no
        JSON body is accepted. Resolve event/request/memberships from current server state, conceal
        inaccessible IDs, and lock the canonical pair/request with a lock order compatible with
        block. Recheck account, membership, block, event/networking and request expiry using trusted
        transaction time; scheduler delay cannot extend permission. Require pending state: 409 for a
        terminal or expired request, 412 for a stale version after access checks. Acceptance creates
        one active connection and outbox fact atomically with the request transition. It creates no
        contact grants and returns no contact fields. Idempotent replay requires live authorization
        before returning safe current state. Real transaction, authorization and concurrency
        enforcement are future work."
      x-authorization:
        actor: request-receiver
        scope: event-request-pair
        invariants:
          - active-same-event-memberships
          - live-participant-role
          - pending-request-only
          - open-networking-window
          - live-request-expiry
          - no-blocked-pair
          - strong-request-version
          - canonical-pair-lock
          - transactional-outbox
          - live-networking-consent
          - unique-connection
          - no-automatic-contact-grants
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Connection created without contact grants. ETag is the connection version.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionEnvelope'
              examples:
                synthetic:
                  value:
                    data:
                      id: 01900000-0000-7000-8000-000000000006
                      event_id: 01900000-0000-7000-8000-000000000002
                      request_id: 01900000-0000-7000-8000-000000000005
                      member_low: 01900000-0000-7000-8000-000000000003
                      member_high: 01900000-0000-7000-8000-000000000004
                      status: active
                      connected_at: 2027-01-20T09:01:00Z
                      version: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /events/{eid}/requests/{rid}/decline:
    post:
      operationId: declineConnectionRequest
      summary: Decline a pending connection request
      tags:
        - Requests
      description:
        "Only the request-receiver may act. Require the request's strong If-Match version; no
        JSON body is accepted. Resolve event/request/memberships from current server state, conceal
        inaccessible IDs, and lock the canonical pair/request with a lock order compatible with
        block. Recheck account, membership, block, event/networking and request expiry using trusted
        transaction time; scheduler delay cannot extend permission. Require pending state: 409 for a
        terminal or expired request, 412 for a stale version after access checks. Increment request
        version and commit the transition with minimal outbox facts; never modify a terminal request
        or restore contact access. Real transaction, authorization and concurrency enforcement are
        future work."
      x-authorization:
        actor: request-receiver
        scope: event-request-pair
        invariants:
          - active-same-event-memberships
          - live-participant-role
          - pending-request-only
          - open-networking-window
          - live-request-expiry
          - no-blocked-pair
          - strong-request-version
          - canonical-pair-lock
          - transactional-outbox
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Pending request transitioned. ETag is the new request version.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclinedRequestEnvelope'
              examples:
                synthetic:
                  value:
                    data:
                      id: 01900000-0000-7000-8000-000000000005
                      event_id: 01900000-0000-7000-8000-000000000002
                      sender:
                        membership_id: 01900000-0000-7000-8000-000000000003
                        event_id: 01900000-0000-7000-8000-000000000002
                        display_name: Synthetic attendee
                        headline: Contract fixture
                        interests:
                          - Platforms
                          - Accessibility
                          - Testing
                        goals:
                          - Offer platform mentorship
                      receiver:
                        membership_id: 01900000-0000-7000-8000-000000000004
                        event_id: 01900000-0000-7000-8000-000000000002
                        display_name: Synthetic attendee
                        headline: Contract fixture
                        interests:
                          - Platforms
                          - Accessibility
                          - Testing
                        goals:
                          - Offer platform mentorship
                      status: declined
                      created_at: 2027-01-20T09:00:00Z
                      expires_at: 2027-01-27T17:00:00Z
                      version: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /events/{eid}/requests/{rid}/withdraw:
    post:
      operationId: withdrawConnectionRequest
      summary: Withdraw a pending connection request
      tags:
