          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawnRequestEnvelope'
              examples:
                synthetic:
                  value:
                    data:
                      id: 01900000-0000-7000-8000-000000000005
                      event_id: 01900000-0000-7000-8000-000000000002
                      sender:
                        membership_id: 01900000-0000-7000-8000-000000000003
                        event_id: 01900000-0000-7000-8000-000000000002
                        display_name: Synthetic attendee
                        headline: Contract fixture
                        interests:
                          - Platforms
                          - Accessibility
                          - Testing
                        goals:
                          - Offer platform mentorship
                      receiver:
                        membership_id: 01900000-0000-7000-8000-000000000004
                        event_id: 01900000-0000-7000-8000-000000000002
